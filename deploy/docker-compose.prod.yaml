services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL — одна БД diploma, 4 схемы (init.sql)
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:17.10
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - casual-games-net

  # ─────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:8.8
    container_name: redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - casual-games-net

  # ─────────────────────────────────────────────────────────
  # Kafka KRaft — single node, internal only
  # ─────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - casual-games-net

  # ─────────────────────────────────────────────────────────
  # MinIO — S3-совместимое хранилище аватарок
  # ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - casual-games-net

  # ─────────────────────────────────────────────────────────
  # minio-init — одноразовый bootstrap: создаёт bucket + anonymous read
  # ─────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
        mc mb --ignore-existing myminio/$$PROFILE_PICTURE_BUCKET;
        mc anonymous set download myminio/$$PROFILE_PICTURE_BUCKET;
        echo 'MinIO bucket ready';
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      PROFILE_PICTURE_BUCKET: ${PROFILE_PICTURE_BUCKET}
    networks:
      - casual-games-net

  # ═══════════════════ BACKEND ═══════════════════

  api-gateway:
    image: casual-games/api-gateway:1.0.0
    build:
      context: ../backend
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    env_file: prod.env
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - casual-games-net

  security-service:
    image: casual-games/security-service:1.0.0
    build:
      context: ../backend
      args:
        SERVICE_NAME: security-service
    container_name: security-service
    restart: unless-stopped
    env_file: prod.env
    environment:
      SECURITY_POSTGRES_HOST: ${POSTGRES_HOST}
      SECURITY_POSTGRES_PORT: ${POSTGRES_PORT}
      SECURITY_POSTGRES_DB: ${POSTGRES_DB}
      SECURITY_POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      SECURITY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - casual-games-net

  user-service:
    image: casual-games/user-service:1.0.0
    build:
      context: ../backend
      args:
        SERVICE_NAME: user-service
    container_name: user-service
    restart: unless-stopped
    env_file: prod.env
    environment:
      USER_POSTGRES_HOST: ${POSTGRES_HOST}
      USER_POSTGRES_PORT: ${POSTGRES_PORT}
      USER_POSTGRES_DB: ${POSTGRES_DB}
      USER_POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      USER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - casual-games-net

  bank-service:
    image: casual-games/bank-service:1.0.0
    build:
      context: ../backend
      args:
        SERVICE_NAME: bank-service
    container_name: bank-service
    restart: unless-stopped
    env_file: prod.env
    environment:
      BANK_POSTGRES_HOST: ${POSTGRES_HOST}
      BANK_POSTGRES_PORT: ${POSTGRES_PORT}
      BANK_POSTGRES_DB: ${POSTGRES_DB}
      BANK_POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      BANK_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - casual-games-net

  game-service:
    image: casual-games/game-service:1.0.0
    build:
      context: ../backend
      args:
        SERVICE_NAME: game-service
    container_name: game-service
    restart: unless-stopped
    env_file: prod.env
    environment:
      GAME_POSTGRES_HOST: ${POSTGRES_HOST}
      GAME_POSTGRES_PORT: ${POSTGRES_PORT}
      GAME_POSTGRES_DB: ${POSTGRES_DB}
      GAME_POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      GAME_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - casual-games-net

  websocket-hub-service:
    image: casual-games/websocket-hub-service:1.0.0
    build:
      context: ../backend
      args:
        SERVICE_NAME: websocket-hub-service
    container_name: websocket-hub-service
    restart: unless-stopped
    env_file: prod.env
    environment:
      DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USERNAME}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - casual-games-net

  # ─────────────────────────────────────────────────────────
  # Frontend — статика (React build), за nginx в проде.
  # ─────────────────────────────────────────────────────────
  frontend:
    image: casual-games/frontend:1.0.0
    build:
      context: ../frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - casual-games-net

  # ─────────────────────────────────────────────────────────
  # Nginx — единственная точка входа снаружи
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.31.1
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api-gateway
      - websocket-hub-service
    networks:
      - casual-games-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  minio-data:
    driver: local

networks:
  casual-games-net:
    driver: bridge