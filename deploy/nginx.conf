worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    resolver 127.0.0.11 valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → редирект на HTTPS ─────────────────────────────
    server {
        listen 80;
        server_name casual-games.win www.casual-games.win;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name casual-games.win www.casual-games.win;

        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 6m;

        # ── REST → api-gateway ──────────────────────────────
        location /api/ {
            set $upstream_api_gateway api-gateway:8888;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass          http://$upstream_api_gateway;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  30s;
        }

        # ── WebSocket → websocket-hub-service ───────────────
        location /ws/ {
            set $upstream_ws websocket-hub-service:8081;
            proxy_pass              http://$upstream_ws$request_uri;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade           $http_upgrade;
            proxy_set_header        Connection        $connection_upgrade;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }

        # ── MinIO ────────────────────────────────
        location /s3/ {
            set $upstream_minio minio:9000;
            rewrite ^/s3/(.*)$ /$1 break;
            proxy_pass       http://$upstream_minio;
            proxy_set_header Host minio:9000;
        }

        # ── SPA → frontend ──────────────────────────────────
        location / {
            set $upstream_frontend frontend:80;
            proxy_pass       http://$upstream_frontend;
            proxy_set_header Host $host;
        }
    }
}
