name: Auto Add Closes

on:
  pull_request:
    types: [ opened, reopened, edited ]

permissions:
  pull-requests: write

jobs:
  add-closes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const action = context.payload.action;

            // При edited — реагируем только если изменился заголовок
            if (action === 'edited' && !context.payload.changes?.title) return;

            const title = context.payload.pull_request.title;
            const match = title.match(/CG-\d+/i);
            if (!match) return;

            const closes = `Closes ${match[0].toUpperCase()}`;
            const body = context.payload.pull_request.body || '';

            if (body.includes(closes)) return;

            // Убираем старый Closes если был (при переименовании PR)
            const cleaned = body.replace(/Closes CG-\d+/gi, '').trim();

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: cleaned ? `${cleaned}\n\n${closes}` : closes
            });
