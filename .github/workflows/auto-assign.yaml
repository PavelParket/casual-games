name: Auto Assign

on:
  pull_request:
    types: [ opened, reopened, ready_for_review ]

permissions:
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: kentaro-m/auto-assign-action@v2.0.2
        with:
          configuration-path: '.github/auto-assign-config.yaml'
