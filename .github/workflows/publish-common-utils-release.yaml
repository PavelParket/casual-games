name: Publish common-utils (Release)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish release to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        working-directory: backend/common-utils
        run: ./gradlew test -Pversion=${{ steps.version.outputs.version }} --no-daemon

      - name: Publish release to GitHub Packages
        working-directory: backend/common-utils
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }} --no-daemon
        env:
          GPR_USER: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-backend-images:
    name: Build & push backend image (${{ matrix.service }})
    needs: publish
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - security-service
          - user-service
          - bank-service
          - game-service
          - websocket-hub-service

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            APP_VERSION=${{ needs.publish.outputs.version }}
          secrets: |
            gpr_user=${{ github.actor }}
            gpr_token=${{ secrets.GITHUB_TOKEN }}
          tags: ghcr.io/pavelparket/casual-games/${{ matrix.service }}:${{ needs.publish.outputs.version }}

  build-frontend-image:
    name: Build & push frontend image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/pavelparket/casual-games/frontend:${{ steps.version.outputs.version }}
