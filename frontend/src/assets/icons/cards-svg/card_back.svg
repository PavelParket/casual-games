<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69.075 94.488" width="69.075" height="94.488">
  <!-- Card base -->
  <rect width="69.075" height="94.488" rx="5" ry="5" fill="#1e3a8a"/>
  <!-- Outer gold border -->
  <rect x="2.5" y="2.5" width="64.075" height="89.488" rx="3.5" ry="3.5" fill="none" stroke="#f0c84a" stroke-width="1.5"/>
  <!-- Inner gold border -->
  <rect x="5" y="5" width="59.075" height="84.488" rx="2.5" ry="2.5" fill="none" stroke="#f0c84a" stroke-width="0.75"/>
  <!-- Diamond tiling pattern -->
  <defs>
    <pattern id="dp" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M6 1.5L10.5 6L6 10.5L1.5 6Z" fill="none" stroke="#f0c84a" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>
  <rect x="6" y="6" width="57.075" height="82.488" rx="2" fill="url(#dp)"/>
  <!-- Centre emblem -->
  <circle cx="34.5" cy="47.244" r="13" fill="#1e3a8a" stroke="#f0c84a" stroke-width="1"/>
  <text x="34.5" y="47.244" text-anchor="middle" dominant-baseline="central"
        font-size="18" fill="#f0c84a" font-family="serif">♠</text>
</svg>
