spring:
  application:
    name: api-gateway

  config:
    import: optional:file:.env[.properties]

  http:
    codecs:
      max-in-memory-size: 6MB

  data:
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 1s

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: ${RATE_LIMIT_REPLENISH_RATE:10}
                  burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:20}
                  requestedTokens: 1
                key-resolver: "#{@keyResolver}"
          routes:
            # Production Routes
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/user-service/api/**
              filters:
                - StripPrefix=2

            - id: security-service
              uri: ${SECURITY_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/security-service/api/**
              filters:
                - StripPrefix=2

            - id: game-service
              uri: ${GAME_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/game-service/api/**
              filters:
                - StripPrefix=2

            - id: websocket-hub-service
              uri: ${WEBSOCKET_HUB_URL:http://localhost:8081}
              predicates:
                - Path=/websocket-hub-service/api/**
              filters:
                - StripPrefix=2

            - id: bank-service
              uri: ${BANK_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/bank-service/api/**
              filters:
                - StripPrefix=2

            - id: notifications
              uri: ${NOTIFICATIONS_URL:http://localhost:8085}
              predicates:
                - Path=/notifications/api/**
              filters:
                - StripPrefix=2

            # Development Routes for Swagger Documentation
            - id: user-service-unsecured
              uri: ${USER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/user-service/doc/**

            - id: security-service-unsecured
              uri: ${SECURITY_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/security-service/doc/**

            - id: game-service-unsecured
              uri: ${GAME_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/game-service/doc/**

            - id: websocket-hub-service-unsecured
              uri: ${WEBSOCKET_HUB_URL:http://localhost:8081}
              predicates:
                - Path=/websocket-hub-service/doc/**

            - id: bank-service-unsecured
              uri: ${BANK_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/bank-service/doc/**

            - id: notifications-unsecured
              uri: ${NOTIFICATIONS_URL:http://localhost:8085}
              predicates:
                - Path=/notifications/doc/**
  cors:
    allowed-origins: ${ALLOWED_ORIGINS_URLS:http://localhost:5173,https://localhost:5173}

  security:
    jwt:
      secret: ${JWT_SECRET}
      algorithm: ${JWT_ALGORITHM:HS256}
      public-paths:
        - /doc/**
        - /actuator/**
        - /security-service/auth/login
        - /security-service/auth/register
        - /security-service/auth/refresh
        - /security-service/auth/logout
        - /bank-service/transactions/top-wins
        - /security-service/doc/**
        - /user-service/doc/**
        - /bank-service/doc/**
        - /game-service/doc/**
        - /websocket-hub-service/doc/**
        - /notifications/doc/**

server:
  port: 8888
  max-http-request-header-size: 16384

server-url: ${SERVER_URL:http://localhost:8888}
server-route:

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /doc/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /doc/swagger-ui.html
    operationsSorter: alpha
    urls:
      - url: ${SERVER_URL:http://localhost:8888}/security-service/doc/api-docs
        name: Security Service API
      - url: ${SERVER_URL:http://localhost:8888}/user-service/doc/api-docs
        name: User Service API
      - url: ${SERVER_URL:http://localhost:8888}/bank-service/doc/api-docs
        name: Bank Service API
      - url: ${SERVER_URL:http://localhost:8888}/game-service/doc/api-docs
        name: Game Service API
      - url: ${SERVER_URL:http://localhost:8888}/websocket-hub-service/doc/api-docs
        name: Websocket Hub API
      - url: ${SERVER_URL:http://localhost:8888}/notifications/doc/api-docs
        name: Notifications API
