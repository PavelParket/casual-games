spring:
  application:
    name: api-gateway

  config:
    import: optional:file:.env[.properties]

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1

        - id: security-service
          uri: http://localhost:8080
          predicates:
            - Path=/security-service/**
          filters:
            - StripPrefix=1
  security:
    jwt:
      secret: ${JWT_SECRET}

logging:
  level:
    # Отладка маршрутизации и фильтров Gateway
    org.springframework.cloud.gateway: DEBUG
    # Отладка вашего кастомного фильтра
    casualgames.apigateway.filter.JwtAuthenticationFilter: DEBUG
    # Отладка Spring Security (авторизация)
    org.springframework.security: DEBUG
    # Отладка HTTP-запросов и ответов (опционально)
    reactor.netty.http.client: DEBUG


server:
  port: 8088
