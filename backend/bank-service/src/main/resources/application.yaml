spring:
  application:
    name: bank-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${BANK_POSTGRES_HOST:localhost}:${BANK_POSTGRES_PORT:5432}/${BANK_POSTGRES_DB:diploma}?currentSchema=${BANK_DB_DEFAULT_SCHEMA:bank_service}
    username: ${BANK_POSTGRES_USERNAME}
    password: ${BANK_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: bank-service

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: bank_service
    liquibase-schema: bank_service

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: bank_service

  data:
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes default
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}  # 24 hours default
    service-whitelist:
      enabled: true
      hosts: [ "127.0.0.1" ]

server:
  port: 8084

grpc:
  server:
    port: 7094
    security:
      enabled: false
  client:
    user-service:
      address: static://localhost:7093
      negotiation-type: plaintext
      keep-alive-time: 30s
      keep-alive-timeout: 5s
  client-custom:
    timeout-seconds: 30
    retry:
      max-attempts: 3
      delay-milliseconds: 1000


app:
  user-service:
    url: http://localhost:8083

  scheduling:
    transaction-summary:
      initial-delay: 10000
      fixed-rate: P30D # every month default

logging:
  level:
    org.springframework.web: DEBUG
