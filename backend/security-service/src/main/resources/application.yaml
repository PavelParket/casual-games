spring:
  application:
    name: security-service

  config:
    import: optional:file:.env[.properties]

  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  datasource:
    url: jdbc:postgresql://${SECURITY_POSTGRES_HOST}:${SECURITY_POSTGRES_PORT}/${SECURITY_POSTGRES_DB}
    username: ${SECURITY_POSTGRES_USERNAME}
    password: ${SECURITY_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  data:
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}  # optional

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes default
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}  # 24 hours default
    service-whitelist:
      enabled: true
      hosts: [ "127.0.0.1" ]

grpc:
  server:
    port: 7080
    security:
      enabled: false
  client:
    user-service:
      address: static://localhost:7093
      negotiation-type: plaintext
      keep-alive-time: 30s
      keep-alive-timeout: 5s
  client-custom:
    timeout-seconds: 30
    retry:
      max-attempts: 3
      delay-milliseconds: 1000

server:
  port: 8080

kafka:
  enabled: true
  consumer-enabled: true
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer-config:
    "[group.id]": security-service-user-sync
    "[auto.offset.reset]": earliest
  topics:
    user: ${KAFKA_USER_TOPIC:user}

app:
  user-service:
    url: http://localhost:8083

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.grpc_utils: DEBUG