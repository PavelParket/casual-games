plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

def grpcVersion = '1.80.0'
def protobufVersion = '4.34.1'

dependencyManagement {
    dependencies {
        dependency "io.grpc:grpc-netty-shaded:${grpcVersion}"
        dependency "io.grpc:grpc-core:${grpcVersion}"
        dependency "io.grpc:grpc-protobuf:${grpcVersion}"
        dependency "io.grpc:grpc-stub:${grpcVersion}"
        dependency "com.google.protobuf:protobuf-java:${protobufVersion}"
    }
}

dependencies {
    implementation 'com.casualgames:common-utils:1.0.0'
    implementation 'com.casualgames:security-starter:1.0.0'
    implementation 'com.casualgames:redis-starter:1.0.0'
    implementation 'com.casualgames:grpc-utils:1.0.0'
    implementation 'com.casualgames:kafka-starter:1.0.0'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'

    // gRPC
    implementation "net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE"
    implementation "net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE"

    runtimeOnly 'org.postgresql:postgresql:42.7.10'

    implementation 'org.liquibase:liquibase-core'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}