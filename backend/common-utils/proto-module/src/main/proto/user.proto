syntax = "proto3";

package user;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option java_package = "com.casualgames.grpc.user";
option java_multiple_files = true;

message CreateUserRequest {
  string guid = 1;
  string username = 2;
  string email = 3;
}

message UserResponse {
  int64 id = 1;
  string guid = 2;
  string username = 3;
  string email = 4;
  string balance = 5;
  string role = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  string link_profile_picture = 9;
  string link_profile_picture_mini = 10;
}

message UpdateUserRequest {
  string guid = 1;
  string username = 2;
  string email = 3;
  string password = 4;
}

message UpdateUserResponse {
  string guid = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  google.protobuf.Timestamp created_at = 5;
}

message UpdateUserRoleRequest {
  string guid = 1;
  string role = 2;
}

message DeleteUserRequest {
  string guid = 1;
}

message GetByGuidRequest {
  string guid = 1;
}

service UserService {
  rpc CreateUser (CreateUserRequest) returns (UserResponse);

  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);

  rpc UpdateUserRole(UpdateUserRoleRequest) returns (google.protobuf.Empty);

  rpc DeleteUser (DeleteUserRequest) returns (google.protobuf.Empty);

  rpc GetByGuid (GetByGuidRequest) returns (UserResponse);
}
