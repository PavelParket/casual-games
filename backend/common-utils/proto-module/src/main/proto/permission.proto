syntax = "proto3";

package permission;

option java_package = "com.casualgames.grpc.permission";
option java_multiple_files = true;

message UserPermissionsRequest {
  string email = 1;
  repeated string roles = 2;
}

message UserPermissionsResponse {
  repeated string permissions = 1;
}

message CheckPermissionRequest {
  string email = 1;
  repeated string roles = 2;
  string attribute = 3;
  string operation = 4;
  bool is_owner = 5;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string matched_permission = 2;
}

message RolePermissionsRequest {
  string role_name = 1;
}

message RolePermissionsResponse {
  repeated string permissions = 1;
}

message SyncUserPermissionsRequest {
  string user_guid = 1;
}

message SyncUserPermissionsResponse {
  bool success = 1;
  string message = 2;
}

service PermissionService {

  rpc GetUserPermissions (UserPermissionsRequest) returns (UserPermissionsResponse);

  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);

  rpc GetRolePermissions (RolePermissionsRequest) returns (RolePermissionsResponse);

  rpc SyncUserPermissions (SyncUserPermissionsRequest) returns (SyncUserPermissionsResponse);
}
