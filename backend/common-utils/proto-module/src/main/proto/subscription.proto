syntax = "proto3";

package subscription;

option java_package = "com.casualgames.grpc.subscription";
option java_multiple_files = true;

message SubscriptionTransactionRequest {
  string user_guid = 1;
  string amount = 2;
  string type = 3;
}

message SubscriptionTransactionResponse {
  int64  transaction_id = 1;
  string status = 2;
}

service SubscriptionTransactionService {
  rpc Charge (SubscriptionTransactionRequest) returns (SubscriptionTransactionResponse);
}