plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'casualgames'
version = '0.0.1-SNAPSHOT'
description = 'user-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

def grpcVersion = '1.81.0'
def protobufVersion = '4.34.1'
def grpcSpring = '3.1.0.RELEASE'

dependencyManagement {
    dependencies {
        dependency "io.grpc:grpc-stub:${grpcVersion}"
        dependency "io.grpc:grpc-protobuf:${grpcVersion}"
        dependency "io.grpc:grpc-netty-shaded:${grpcVersion}"
        dependency "io.grpc:grpc-api:${grpcVersion}"
        dependency "io.grpc:grpc-netty:${grpcVersion}"
        dependency "io.grpc:grpc-core:${grpcVersion}"
        dependency "io.grpc:grpc-protobuf-lite:${grpcVersion}"
        dependency "io.grpc:grpc-context:${grpcVersion}"
        dependency "io.grpc:grpc-services:${grpcVersion}"
        dependency "io.grpc:grpc-inprocess:${grpcVersion}"
        dependency "io.grpc:grpc-util:${grpcVersion}"
        dependency "com.google.protobuf:protobuf-java:${protobufVersion}"
        dependency "com.google.protobuf:protobuf-java-util:${protobufVersion}"
    }
}

dependencies {
    // Custom starters
    implementation 'com.casualgames:common-utils:1.0.0'
    implementation "com.casualgames:security-starter:1.0.0"
    implementation 'com.casualgames:grpc-utils:1.0.0'
    implementation 'com.casualgames:kafka-starter:1.0.0'
    implementation 'com.casualgames:file-management-starter:1.0.0'

    //Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    //  gRPC
    implementation "net.devh:grpc-server-spring-boot-starter:${grpcSpring}"
    implementation "net.devh:grpc-client-spring-boot-starter:${grpcSpring}"

    // Files processing
    implementation 'org.apache.tika:tika-core:3.3.0'

    // Postgresql
    runtimeOnly 'org.postgresql:postgresql:42.7.11'

    // Liquibase
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Mapstruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // JUnit
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
