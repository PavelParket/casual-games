spring:
  application:
    name: websocket-hub-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration: ${JWT_ACCESS_EXPIRATION}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION}

  data:
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}  # optional

server:
  port: 8081

app:
  game-service:
    url: http://localhost:8082
  user-service:
    url: http://localhost:8083
  bank-service:
    url: http://localhost:8084

scheduler:
  room-cleanup:
    scheduler-delay-minutes: 5
    scheduler-initial-delay-minutes: 5
    finished-kick-timeout-minutes: 2
    pending-delete-delay-seconds: 2

kafka:
  enabled: ${KAFKA_ENABLED:true}
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer-config:
    "[acks]": "1"
  topics:
    room-lifecycle: ${KAFKA_ROOM_LIFECYCLE_TOPIC:room-lifecycle}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.websocket: DEBUG
